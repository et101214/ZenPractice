name: iOS Preview

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform project
        run: flutter create --platforms=ios --org com.zenpractice .
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ZenPractice-iOS-Simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
